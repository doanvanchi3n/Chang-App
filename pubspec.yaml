name: chang_app
description: "Chặng — Ứng dụng học tập và quản lý tiến độ."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  supabase_flutter: ^2.18.3
  shared_preferences: ^2.5.6
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/Onboarding.svg
    - assets/mascot/onboarding_body.svg
    - assets/mascot/onboarding_wave.svg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
