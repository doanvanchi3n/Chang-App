<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="210 35 880 900" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Chặng – Mascot chim cánh cụt đang đọc sách</title>
  <desc id="description">Minh họa vector chim cánh cụt màu xanh đậm đội mũ nồi xanh, đeo túi vàng và đang đọc sách. Nền trong suốt, các phần có thể chỉnh sửa.</desc>
  <defs>
    <linearGradient id="bodyGradient" x1="378" y1="280" x2="915" y2="729" gradientUnits="userSpaceOnUse">
      <stop stop-color="#103D69"/><stop offset="0.54" stop-color="#194570"/><stop offset="1" stop-color="#0D3156"/>
    </linearGradient>
    <linearGradient id="wingGradient" x1="277" y1="535" x2="425" y2="695" gradientUnits="userSpaceOnUse">
      <stop stop-color="#174674"/><stop offset="1" stop-color="#10365F"/>
    </linearGradient>
    <linearGradient id="faceGradient" x1="614" y1="290" x2="703" y2="863" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF9"/><stop offset="0.7" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFFDF7"/>
    </linearGradient>
    <linearGradient id="hatTop" x1="491" y1="124" x2="775" y2="273" gradientUnits="userSpaceOnUse">
      <stop stop-color="#377DC0"/><stop offset="0.56" stop-color="#4E99DE"/><stop offset="1" stop-color="#3983C7"/>
    </linearGradient>
    <linearGradient id="hatBrim" x1="490" y1="244" x2="821" y2="167" gradientUnits="userSpaceOnUse">
      <stop stop-color="#75B3F0"/><stop offset="0.56" stop-color="#67ABED"/><stop offset="1" stop-color="#327CC6"/>
    </linearGradient>
    <linearGradient id="strapGradient" x1="376" y1="492" x2="699" y2="714" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFDA6C"/><stop offset="0.55" stop-color="#FFC94A"/><stop offset="1" stop-color="#FFBB2F"/>
    </linearGradient>
    <linearGradient id="bagGradient" x1="676" y1="681" x2="863" y2="819" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC447"/><stop offset="0.57" stop-color="#FFCD5B"/><stop offset="1" stop-color="#FBC954"/>
    </linearGradient>
    <linearGradient id="bagFlapGradient" x1="686" y1="700" x2="834" y2="763" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFDD76"/><stop offset="1" stop-color="#FEC34C"/>
    </linearGradient>
    <linearGradient id="leftPage" x1="701" y1="512" x2="865" y2="733" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8E6"/><stop offset="1" stop-color="#FFF0CF"/>
    </linearGradient>
    <linearGradient id="rightPage" x1="859" y1="510" x2="1026" y2="738" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9E6"/><stop offset="0.95" stop-color="#FFF0CB"/>
    </linearGradient>
    <linearGradient id="beakGradient" x1="702" y1="395" x2="739" y2="465" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFCE38"/><stop offset="1" stop-color="#FFAB00"/>
    </linearGradient>
    <linearGradient id="footGradient" x1="401" y1="829" x2="805" y2="886" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB900"/><stop offset="0.5" stop-color="#FFA900"/><stop offset="1" stop-color="#FFBB1D"/>
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-30%" width="140%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <!-- Mỗi nhóm là một thành phần độc lập để biên tập trong Figma/Illustrator. -->
  <g id="ground-shadow" opacity="0.36">
    <ellipse cx="659" cy="870" rx="306" ry="21" fill="#A9C1CB" filter="url(#subtleShadow)"/>
    <ellipse cx="629" cy="865" rx="245" ry="15" fill="#B4C5C0" opacity="0.48"/>
  </g>

  <g id="attention-rays" stroke="#FFAC0A" stroke-width="19" stroke-linecap="round">
    <path d="M337 247L298 234"/><path d="M363 206L331 178"/><path d="M408 169L392 129"/>
  </g>

  <g id="feet" fill="url(#footGradient)">
    <path id="left-foot" d="M434 820C411 821 390 832 383 848C377 865 386 873 402 874C412 876 423 871 429 866C428 881 437 885 453 883C469 883 479 875 484 868C490 882 507 887 522 879C536 873 536 857 520 846C494 827 464 818 434 820Z"/>
    <path d="M430 861C433 846 437 836 445 830" stroke="#E89B0B" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path id="right-foot" d="M696 821C678 822 665 836 668 854C670 871 689 878 707 875C722 885 739 882 748 870C759 883 774 881 783 869C798 876 814 865 816 854C815 835 789 820 765 819Z"/>
    <path d="M730 844L733 869M768 845L769 864" stroke="#E89B0B" stroke-width="4" stroke-linecap="round" opacity="0.42"/>
  </g>

  <!-- Cánh trái nằm phía sau thân -->
  <g id="left-flipper">
    <path d="M383 476C351 506 315 563 291 619C277 655 275 675 294 688C314 702 345 691 378 673C406 657 426 624 433 592L414 519Z" fill="url(#wingGradient)"/>
  </g>

  <g id="penguin-body">
    <path d="M475 251C516 208 590 184 669 184C765 183 840 232 884 309C914 364 916 435 899 492C897 534 917 592 911 667C906 751 874 808 823 831C778 855 667 855 556 852C457 851 402 822 371 764C336 693 356 617 365 560C376 492 373 432 390 366C407 314 435 274 475 251Z" fill="url(#bodyGradient)"/>
    <path d="M846 283C886 355 892 439 872 516C902 616 908 746 840 814C874 792 903 737 910 674C917 597 899 545 899 492C916 435 913 363 883 309C871 287 856 269 846 283Z" fill="#092F56" opacity="0.15"/>
  </g>

  <g id="white-face-and-tummy">
    <path d="M607 290C556 288 510 329 490 393C470 458 490 507 540 529C492 562 455 627 441 699C423 767 432 822 473 838C517 855 690 856 749 842C805 826 829 780 824 713C821 641 806 576 779 526C843 525 876 480 872 418C868 354 841 305 801 307C751 300 723 340 716 418C708 365 677 290 607 290Z" fill="url(#faceGradient)"/>
  </g>

