    <ellipse id="right-eye" cx="792" cy="394" rx="21" ry="26" fill="#082958"/>
    <circle id="left-cheek" cx="569" cy="436" r="33" fill="#F8C8BB" opacity="0.91"/>
    <circle id="right-cheek" cx="818" cy="451" r="31" fill="#F7C8BC" opacity="0.91"/>
    <path id="beak" d="M711 386C686 388 672 412 666 426C661 448 682 466 710 467C735 467 755 451 757 433C757 411 735 386 711 386Z" fill="url(#beakGradient)"/>
    <path id="beak-smile" d="M675 429C699 434 728 438 749 430" stroke="#E88C03" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <g id="beret">
    <path id="beret-tip" d="M585 117C585 98 615 99 625 120L617 135L588 132Z" fill="#1C568D"/>
    <path id="beret-dome" d="M484 253C481 211 509 162 549 142C585 120 650 112 694 120C740 127 766 152 777 189C739 185 691 208 637 232C581 256 524 266 484 253Z" fill="url(#hatTop)"/>
    <path id="beret-brim" d="M478 252C522 263 588 243 654 209C710 181 760 165 792 166C812 168 828 184 829 201C830 217 819 229 808 229C789 229 779 217 762 221C734 225 693 248 658 260C588 291 522 281 482 263C478 261 476 256 478 252Z" fill="url(#hatBrim)"/>
    <path d="M493 262C552 272 615 241 656 221" stroke="#BCE3FF" stroke-width="3" opacity="0.15" stroke-linecap="round"/>
  </g>

  <!-- Quai túi nằm phía trước ngực và phía sau quyển sách -->
  <g id="shoulder-strap">
    <path d="M380 488C452 563 552 633 690 707" stroke="url(#strapGradient)" stroke-width="29" stroke-linecap="round"/>
    <path d="M383 489C459 562 562 643 679 698" stroke="#FFE297" stroke-width="4" stroke-linecap="round" opacity="0.16"/>
  </g>

  <g id="crossbody-bag">
    <path id="bag-body" d="M683 653C716 650 768 656 811 660C838 661 861 676 868 707L867 796C867 813 854 824 837 830C802 842 728 838 700 830C680 823 670 811 670 788L669 680C669 667 674 656 683 653Z" fill="url(#bagGradient)"/>
    <path d="M684 665L683 790C684 809 690 815 703 823" stroke="#F5A919" stroke-width="6" opacity="0.35" stroke-linecap="round"/>
    <path id="bag-flap" d="M683 675C718 663 766 672 811 682C835 688 855 708 859 726C860 746 855 756 840 766C809 784 748 784 715 769C695 759 683 731 683 675Z" fill="url(#bagFlapGradient)"/>
    <path id="bag-seam" d="M684 701C690 735 700 759 721 765C745 772 814 783 843 758" stroke="#F0A82C" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <rect id="bag-buckle" x="778" y="746" width="38" height="51" rx="16" fill="#123A65"/>
    <ellipse id="bag-buckle-hole" cx="797" cy="771" rx="8" ry="11" fill="#FFEFBD"/>
  </g>

  <!-- Cánh phải nằm phía sau sách -->
  <g id="right-flipper-back">
    <path d="M861 536C893 547 933 567 958 606C972 628 972 665 958 683C942 700 913 697 893 685L844 643Z" fill="#123A66"/>
  </g>

  <g id="open-book">
    <path id="book-left-side-shadow" d="M679 482C700 483 707 495 711 517L744 707C778 719 823 734 856 755L849 766C804 751 751 739 719 724C703 698 677 539 676 500C675 490 676 484 679 482Z" fill="#BFAF89" opacity="0.21"/>
    <path id="book-left-page" d="M687 475C737 490 810 517 857 528L852 755C802 744 755 727 723 711C701 635 682 525 687 475Z" fill="url(#leftPage)"/>
    <path id="book-right-page" d="M857 528C914 504 980 467 1025 440C1018 523 1009 630 997 710C955 730 907 744 852 755Z" fill="url(#rightPage)"/>
    <path id="book-spine" d="M857 529C856 603 852 677 852 755" stroke="#ECDAB8" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
    <path id="book-left-page-highlight" d="M693 484C741 502 800 524 846 535" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.29"/>
    <path id="book-right-page-highlight" d="M867 533C910 516 967 482 1013 455" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.26"/>
  </g>

  <!-- Hai cánh giữ trang sách -->
  <g id="book-holding-flippers">
    <path id="left-flipper-on-book" d="M718 626C742 629 763 650 765 674C768 702 751 728 727 731C705 734 682 719 679 690C674 666 690 632 718 626Z" fill="#16436D"/>
    <path id="right-flipper-on-book" d="M981 594C1005 594 1017 615 1016 641C1015 668 999 681 981 683C963 681 946 664 946 643C946 619 956 595 981 594Z" fill="#15416A"/>
